{% extends "base.html" %}

{% block title %}Access Denied - BOMMagic{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="text-center py-5">
                <div class="mb-4">
                    <i data-feather="shield-off" class="text-danger" width="72" height="72"></i>
                </div>
                
                <h1 class="h2 mb-3">Access Denied</h1>
                <p class="text-muted mb-4">
                    You don't have permission to access this resource. 
                    This might be because your session has expired or you need to sign in.
                </p>
                
                <div class="d-flex gap-3 justify-content-center">
                    <a href="{{ url_for('replit_auth.login') }}" class="btn btn-primary">
                        <i data-feather="log-in" class="me-2"></i>
                        Sign In
                    </a>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                        <i data-feather="home" class="me-2"></i>
                        Go Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
